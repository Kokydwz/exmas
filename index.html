<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول الامتحانات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg,#e9f0ff,#f7f9fc);
    margin:0;
    padding:20px;
    color:#333;
}
.container { max-width:900px; margin:auto; }
h2 { text-align:center; margin-bottom:25px; color:#2a2a2a; font-weight:700; }

select#gradeSelect {
    width:100%;
    padding:12px;
    margin:12px 0 25px 0;
    border-radius:12px;
    border:none;
    background: linear-gradient(135deg,#6b8cff,#3b5bff);
    color:white;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
}
select#gradeSelect option { color:#333; font-weight:400; }

.card {
    background:white;
    padding:22px;
    margin:15px 0;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    transition:0.3s;
}
.card:hover { transform:translateY(-4px); box-shadow:0 6px 20px rgba(111,130,255,0.25);}
.subject-box { display:flex; justify-content:space-between; align-items:center; }
.subject-info { display:flex; flex-direction:column; }
.subject-info span.desc { font-size:14px; color:#555; margin-top:5px; }
.subject-info span.date { font-size:14px; color:#888; margin-top:2px; }

.footer { text-align:center; margin-top:40px; color:#777; font-size:14px; }

#examList { min-height:50px; }
</style>
</head>
<body>

<div class="container">

    <h2><i class="fa-solid fa-calendar-days"></i> جدول الامتحانات</h2>
    <label><i class="fa-solid fa-layer-group"></i> اختر الصف</label>
    <select id="gradeSelect">
        <option value="">-- اختر الصف --</option>
        <option value="sixth">الصف السادس</option>
        <option value="fifth">الصف الخامس</option>
        <option value="fourth">الصف الرابع</option>
    </select>

    <div id="examList"></div>
</div>

<div class="footer">
    <p>© منصة جدول الامتحانات</p>
</div>

<script>
// عنصر عرض البطاقات
const examList = document.getElementById("examList");
let examsData = {};

// تحميل JSON
fetch("exams.json")
  .then(res => {
    if(!res.ok) throw new Error("لم يتم العثور على الملف exams.json");
    return res.json();
  })
  .then(data => examsData = data)
  .catch(err => {
    examList.innerHTML = `<p style="color:red; text-align:center;">⚠ خطأ في تحميل البيانات: ${err.message}</p>`;
  });

// عرض الامتحانات حسب الصف
document.getElementById("gradeSelect").addEventListener("change", ()=>{
    let grade = document.getElementById("gradeSelect").value;
    examList.innerHTML = "";
    if(!grade) return;

    if(!examsData[grade] || examsData[grade].length===0){
        examList.innerHTML = `<p style="text-align:center; color:#555;">لا توجد امتحانات لهذا الصف</p>`;
        return;
    }

    examsData[grade].forEach(ex=>{
        examList.innerHTML += `
        <div class="card">
            <div class="subject-box">
                <div class="subject-info">
                    <h3><i class="fa ${ex.icon}" style="color:#3b5bff;"></i> ${ex.name}</h3>
                    <span class="desc">${ex.desc}</span>
                    <span class="date">${ex.day} - ${ex.date}</span>
                </div>
            </div>
        </div>`;
    });
});
</script>

</body>
</html>
